<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1f33" />
    <meta name="description" content="MunilaLog — Sistema de Acompanhamento Logístico" />
    <title>MunilaLog</title>
    <script>
      // aplica o tema salvo antes da primeira pintura (evita "piscar" claro/escuro)
      try {
        var t = JSON.parse(localStorage.getItem('munilalog:tema') || 'null');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
